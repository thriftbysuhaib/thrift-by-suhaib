<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Product | Thrift by Suhaib</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <a href="index.html" class="logo">
        THRIFT BY SUHAIB
    </a>
    <nav>
        <a href="index.html#shop">
            Shop
        </a>
        <button
            class="cart-button"
            onclick="openCart()"
        >
            Cart <span id="cartCount">0</span>
        </button>
    </nav>
</header>
<main class="product-page">
    <div id="productDetails"></div>
</main>
<!-- CART -->
<div id="cartOverlay" class="cart-overlay">
    <div class="cart">
        <button
            class="close-cart"
            onclick="closeCart()"
        >
            ×
        </button>
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <div class="cart-bottom">
            <h3>
                Total: Rs.
                <span id="cartTotal">0</span>
            </h3>
            <button
                class="whatsapp-button"
                onclick="orderCart()"
            >
                Order on WhatsApp
            </button>
        </div>
    </div>
</div>
<script src="script.js"></script>
<script>
    loadProductPage();
</script>
</body>
</html>
